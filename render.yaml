services:
  - type: web
    name: assistente-virtual-front
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /healthz
    envVars:
      - key: CRM_API_URL
        value: https://salesforceteste.vercel.app
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: GOOGLE_SHEET_ID
        sync: false
      - key: GOOGLE_SHEET_RANGE
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
