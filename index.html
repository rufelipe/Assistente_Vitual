<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assistente virtual</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --ink: #20283a;
      --muted: #758096;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      background: #f3f6fa;
      color: var(--ink);
    }
    button { font: inherit; }
    .assistant {
      position: fixed;
      right: 32px;
      bottom: 24px;
      z-index: 10;
      width: min(350px, calc(100vw - 32px));
    }
    .panel {
      overflow: hidden;
      border: 1px solid rgba(30, 40, 60, .08);
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 18px 55px rgba(37, 44, 72, .18);
    }
    .assistant-header {
      padding: 18px;
      color: #fff;
      background: linear-gradient(135deg, #5848d8, #8d7af2);
    }
    .assistant-headrow { display: flex; align-items: center; gap: 10px; }
    .avatar {
      display: grid;
      flex: 0 0 42px;
      width: 42px;
      height: 42px;
      place-items: center;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.35);
      border-radius: 13px;
      background: rgba(255,255,255,.14);
    }
    .avatar img { width: 28px; height: 28px; object-fit: contain; }
    .heading { flex: 1; min-width: 0; }
    .heading strong { display: block; font-size: 15px; }
    .online { margin-top: 4px; color: #e6e2ff; font-size: 11px; }
    .online::before {
      display: inline-block;
      width: 7px;
      height: 7px;
      margin-right: 6px;
      border-radius: 50%;
      background: #72e2b0;
      content: "";
    }
    .close {
      padding: 0 3px;
      border: 0;
      background: transparent;
      color: #fff;
      cursor: pointer;
      font-size: 22px;
      opacity: .85;
    }
    .welcome { margin: 13px 0 0; color: #f0eeff; font-size: 13px; line-height: 1.5; }
    .empty-state { padding: 22px 18px; color: var(--muted); font-size: 13px; line-height: 1.5; }
    .actions { padding: 0 18px 18px; }
    .actions button {
      width: 100%;
      padding: 11px;
      border: 0;
      border-radius: 9px;
      background: #f1f0ff;
      color: #6557d9;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
    }
    .robot {
      display: flex;
      width: 66px;
      height: 66px;
      margin: 10px auto 0;
      align-items: center;
      justify-content: center;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 8px 24px rgba(32, 40, 58, .16);
      cursor: pointer;
      transition: transform .2s ease;
    }
    .robot img { width: 42px; height: 42px; object-fit: contain; }
    .robot:hover { transform: translateY(-2px) scale(1.03); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <aside class="assistant" aria-label="Assistente virtual YODA">
    <section class="panel" id="panel" aria-live="polite">
      <header class="assistant-header">
        <div class="assistant-headrow">
          <div class="avatar" aria-hidden="true"><img src="assets/baby-yoda-head.png" alt=""></div>
          <div class="heading"><strong>Assistente YODA</strong><div class="online">Online</div></div>
          <button class="close" id="close" type="button" aria-label="Minimizar assistente">×</button>
        </div>
        <p class="welcome">Oi! Estou pronta para ajudar. Como posso ajudar você hoje?</p>
      </header>
      <div class="empty-state">Inicie uma conversa com a assistente.</div>
      <div class="actions"><button id="acknowledge" type="button">Entendi</button></div>
    </section>
    <button class="robot" id="toggle" type="button" aria-label="Abrir assistente" hidden>
      <img src="assets/baby-yoda-head.png" alt="">
    </button>
  </aside>
  <script>
    var panel = document.getElementById("panel");
    var toggle = document.getElementById("toggle");

    function minimizeAssistant() {
      panel.hidden = true;
      toggle.hidden = false;
    }

    document.getElementById("close").addEventListener("click", minimizeAssistant);
    document.getElementById("acknowledge").addEventListener("click", minimizeAssistant);
    toggle.addEventListener("click", function () {
      panel.hidden = false;
      toggle.hidden = true;
    });
  </script>
</body>
</html>
