<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Assistente Virtual · Salesforce</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#20283a;background:#f4f5fa}
*{box-sizing:border-box}body{margin:0;min-height:100vh}.assistant{position:fixed;right:24px;bottom:24px;width:min(410px,calc(100vw - 28px));z-index:5}
.panel{background:#fff;border:1px solid #e8eaf1;border-radius:20px;overflow:hidden;box-shadow:0 18px 55px #252c482e}
header{padding:18px 20px;color:#fff;background:linear-gradient(135deg,#6557d9,#8672ed)}
.head{display:flex;align-items:center;gap:12px}.avatar{font-size:25px}.heading{flex:1}.heading strong{display:block;font-size:15px}.status{font-size:11px;color:#e8e4ff;margin-top:4px}
button{cursor:pointer;border:0}.close{background:none;color:#fff;font-size:22px}.welcome{font-size:12px;line-height:1.5;color:#f1efff;margin:13px 0 0}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:13px 15px;border-bottom:1px solid #edf0f5}
.metric{padding:9px;background:#f7f7fc;border-radius:10px;text-align:center}.metric b{display:block;font-size:19px}.metric span{font-size:10px;color:#758096}
.content{max-height:310px;overflow:auto;padding:7px 16px}.section-title{font-size:11px;font-weight:800;color:#6b62bd;margin:12px 0 4px;text-transform:uppercase}
.task{padding:11px 2px;border-bottom:1px solid #edf0f5}.task b{font-size:12px}.task p{font-size:11px;color:#758096;margin:5px 0 0;line-height:1.5}
.badge{display:inline-block;margin-left:5px;padding:3px 7px;border-radius:12px;background:#fff1df;color:#966000;font-size:9px}
.chat{padding:12px 15px;border-top:1px solid #edf0f5}.chat form{display:flex;gap:7px}.chat input{min-width:0;flex:1;border:1px solid #e1e3ec;border-radius:10px;padding:11px;font-size:12px}.chat button,.refresh{background:#6557d9;color:white;border-radius:10px;padding:0 13px;font-size:11px;font-weight:700}
.answer{font-size:11px;line-height:1.5;color:#514a8c;margin:9px 0 0;white-space:pre-wrap}.footer{padding:0 15px 13px;text-align:center;font-size:10px;color:#9aa2b2}
.robot{display:flex;width:60px;height:60px;margin:12px 0 0 auto;align-items:center;justify-content:center;border:3px solid #fff;border-radius:21px;background:linear-gradient(145deg,#796beb,#5748ca);box-shadow:0 8px 25px #4b3db45e;color:white;font-size:29px}
[hidden]{display:none!important}@media(max-width:480px){.assistant{right:14px;bottom:14px}.content{max-height:38vh}}
</style></head>
<body>
<aside class="assistant" aria-label="Assistente Virtual">
<section class="panel" id="panel" aria-live="polite">
<header><div class="head"><div class="avatar">🤖</div><div class="heading"><strong>Assistente Virtual</strong><div class="status" id="status">Conectando ao Salesforce…</div></div><button class="close" id="close" aria-label="Minimizar">×</button></div>
<p class="welcome">Olá! Posso ajudar a localizar tarefas, prazos, prioridades e anotações registradas no CRM.</p></header>
<div class="metrics" id="metrics"><div class="metric"><b>—</b><span>Tarefas</span></div><div class="metric"><b>—</b><span>Atrasadas</span></div><div class="metric"><b>—</b><span>Prioridade alta</span></div></div>
<div class="content" id="content"><p class="task">Carregando informações do Salesforce…</p></div>
<div class="chat"><form id="chat-form"><input id="question" autocomplete="off" placeholder="Ex.: quais tarefas estão atrasadas?" aria-label="Pergunte sobre o CRM"><button type="submit">Enviar</button></form><p class="answer" id="answer"></p></div>
<div class="footer">Dados consultados em tempo real · demonstração sem gravação no CRM</div>
</section><button class="robot" id="toggle" aria-label="Abrir assistente">🤖</button></aside>
<script>
const $=id=>document.getElementById(id);
const esc=value=>String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function render(data){
 const s=data.summary||{};
 $("status").textContent="Conectado ao Salesforce";
 $("metrics").innerHTML=[["total","Tarefas"],["atrasadas","Atrasadas"],["prioridade_alta","Prioridade alta"]].map(([k,l])=>'<div class="metric"><b>'+Number(s[k]||0)+'</b><span>'+l+'</span></div>').join("");
 const groups=[["Atrasadas",data.lists?.atrasadas],["Vencem hoje",data.lists?.vencem_hoje],["Prioridade alta",data.lists?.prioridade_alta]];
 $("content").innerHTML=groups.map(([name,items])=>'<div class="section-title">'+name+' ('+(items||[]).length+')</div>'+((items||[]).length?items.map(t=>'<article class="task"><b>'+esc(t.cliente)+' · '+esc(t.titulo)+'</b><span class="badge">'+esc(t.prioridade)+'</span><p>Responsável: '+esc(t.responsavel)+' · Prazo: '+esc(t.vencimento||"não informado")+' · Status: '+esc(t.status)+'</p>'+(t.observacao?'<p>'+esc(t.observacao)+'</p>':'')+'</article>').join(""):'<p class="task">Nenhum registro.</p>')).join("");
 const notes=data.notes||[];
 const notesSection=document.createElement("section");
 notesSection.innerHTML='<div class="section-title">Anotações do CRM ('+notes.length+')</div>'+(notes.length?notes.map(n=>'<article class="task"><b>'+esc(n.contato)+'</b><p>'+esc(n.texto)+'</p></article>').join(""):'<p class="task">Nenhuma anotação registrada.</p>');
 $("content").appendChild(notesSection);
}
async function refresh(){
 $("status").textContent="Atualizando…";
 try{const response=await fetch("/api/dashboard");const data=await response.json();if(!response.ok)throw new Error(data.detail||data.error||"Falha ao consultar CRM");render(data);}
 catch(error){$("status").textContent="Falha na conexão";$("content").innerHTML='<p class="task">'+esc(error.message)+'<br>Verifique se a API Salesforce está disponível.</p>';}
}
$("chat-form").addEventListener("submit",async event=>{
 event.preventDefault();const question=$("question").value.trim();if(!question)return;
 $("answer").textContent="Consultando Salesforce…";
 try{const response=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({question})});const data=await response.json();if(!response.ok)throw new Error(data.detail||data.error||"Falha na consulta");
 $("answer").textContent=data.answer+"\n"+(data.results||[]).map(item=>item.titulo?("• "+item.cliente+" — "+item.titulo+" (prazo: "+(item.vencimento||"não informado")+")"):("• "+item.contato+": "+item.texto)).join("\n");
 }catch(error){$("answer").textContent=error.message;}
});
$("close").addEventListener("click",()=>$("panel").hidden=true);
$("toggle").addEventListener("click",()=>$("panel").hidden=!$("panel").hidden);
refresh();
</script></body></html>
