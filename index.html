<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assistente YODA</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#20283a}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f3f6fa}
button,input{font:inherit}.assistant{position:fixed;right:28px;bottom:24px;width:min(390px,calc(100vw - 32px));z-index:10}
body.embedded{min-height:100%;height:100%;background:transparent}
body.embedded .assistant{position:static;width:100%;height:100%;max-width:none}
body.embedded .panel{display:flex;flex-direction:column;width:100%;height:100%;border-radius:14px}
body.embedded .messages{flex:1 1 auto;height:auto;min-height:0}
body.embedded .robot{position:absolute;right:12px;bottom:12px;margin:0}
.panel{overflow:hidden;border:1px solid rgba(30,40,60,.08);border-radius:20px;background:#fff;box-shadow:0 18px 55px rgba(37,44,72,.2)}
.header{padding:18px;color:#fff;background:linear-gradient(135deg,#5848d8,#8d7af2)}
.row{display:flex;align-items:center;gap:10px}.avatar{width:43px;height:43px;display:grid;place-items:center;border-radius:14px;background:rgba(255,255,255,.15);overflow:hidden}.avatar img{width:30px;height:30px;object-fit:contain}.heading{flex:1}.heading strong{display:block;font-size:15px}.online{margin-top:4px;color:#e8e5ff;font-size:11px}.online:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#72e2b0;margin-right:6px}.close{border:0;background:transparent;color:#fff;font-size:22px;cursor:pointer}.welcome{margin:13px 0 0;color:#f0eeff;font-size:13px;line-height:1.5}
.messages{height:320px;overflow:auto;padding:16px;background:#fafbfe}.msg{max-width:88%;padding:10px 12px;margin:0 0 10px;border-radius:14px;font-size:13px;line-height:1.5;white-space:pre-wrap}.bot{background:#eeeafd;color:#40377c}.user{margin-left:auto;background:#6557d9;color:#fff}.status{padding:8px 16px;color:#8a92a4;font-size:10px;border-top:1px solid #edf0f5}.composer{display:flex;gap:8px;padding:12px;border-top:1px solid #edf0f5}.composer input{min-width:0;flex:1;padding:11px 12px;border:1px solid #dfe3ec;border-radius:12px;outline:none}.composer input:focus{border-color:#7668df}.send{width:44px;border:0;border-radius:12px;background:#6557d9;color:#fff;cursor:pointer}.robot{display:flex;width:66px;height:66px;margin:10px auto 0;padding:0;align-items:center;justify-content:center;border:0;border-radius:50%;background:#fff;box-shadow:0 8px 24px rgba(32,40,58,.16);cursor:pointer}.robot img{width:43px;height:43px;object-fit:contain}.robot:hover{transform:translateY(-2px) scale(1.03)}[hidden]{display:none!important}
</style>
</head>
<body>
<aside class="assistant" aria-label="Assistente virtual YODA">
<section class="panel" id="panel">
<header class="header"><div class="row">
<div class="avatar"><img src="assets/baby-yoda-head.png" alt=""></div>
<div class="heading"><strong>Assistente YODA</strong><div class="online">Online • CRM conectado</div></div>
<button class="close" id="close" type="button">×</button>
</div><p class="welcome">Olá! Posso consultar o CRM e ajudar com tarefas, prazos, responsáveis, status e anotações.</p></header>
<div class="messages" id="messages"><div class="msg bot">Olá! Estou pronta. O que você gostaria de consultar no CRM?</div></div>
<div class="status" id="status">Conectado ao Salesforce demonstrativo</div>
<form class="composer" id="form"><input id="message" autocomplete="off" placeholder="Digite sua pergunta..." aria-label="Pergunta"><button class="send" type="submit" aria-label="Enviar">➤</button></form>
</section>
<button class="robot" id="toggle" hidden aria-label="Abrir assistente"><img src="assets/baby-yoda-head.png" alt=""></button>
</aside>
<script>
const embedded=new URLSearchParams(window.location.search).get("embed")==="1";
if(embedded) document.body.classList.add("embedded");
const panel=document.getElementById("panel"),toggle=document.getElementById("toggle"),messages=document.getElementById("messages"),input=document.getElementById("message"),status=document.getElementById("status");
window.addEventListener("message",function(event){
 if(event.data&&event.data.type==="yoda-parent-expand"){
  panel.hidden=false;toggle.hidden=true;input.focus();
 }
});
let embeddedTasks = null;
let embeddedNotes = [];
function sendContractOpen(contract) { window.parent.postMessage({type:"yoda-open-contract",contract:String(contract)}, "*"); }
function escapeText(value) {
 return String(value).replace(/[&<>"']/g,function(ch){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch];});
}
function renderOverview() {
 if (!Array.isArray(embeddedTasks)) return;
 const today=new Date();today.setHours(0,0,0,0);
 const overdue=embeddedTasks.filter(function(task){
  if(!task.due||!/^\d{4}-\d{2}-\d{2}$/.test(task.due))return false;
  return new Date(task.due+"T00:00:00")<today &&
   !["concluída","concluida","completed","done"].includes(String(task.status||"").toLowerCase());
 });
 messages.innerHTML="";
 const summary=document.createElement("div");summary.className="msg bot";
 summary.innerHTML="<strong>Resumo do Salesforce</strong><br>"+
  (overdue.length?"⚠️ Você tem <strong>"+overdue.length+"</strong> tarefa(s) em atraso.<br>":"✅ Não encontrei tarefas em atraso.<br>")+
  "📝 "+embeddedNotes.length+" anotação(ões) de ligação disponível(is).";
 messages.appendChild(summary);
 overdue.slice(0,6).forEach(function(task){
  const card=document.createElement("div");card.className="msg bot";
  card.innerHTML="<strong>⚠️ Tarefa atrasada</strong><br>"+escapeText(task.title||"Tarefa")+
   "<br>Prazo: "+escapeText(task.due||"—")+"<br>Contrato: ";
  const link=document.createElement("a");link.href="#";link.textContent=task.contract||"não informado";
  link.onclick=function(event){event.preventDefault();if(task.contract)sendContractOpen(task.contract);};
  card.appendChild(link);card.appendChild(document.createElement("br"));
  card.appendChild(document.createTextNode("Responsável: "+(task.owner||"não informado")));
  messages.appendChild(card);
 });
 if(embeddedNotes.length){const title=document.createElement("div");title.className="msg bot";title.innerHTML="<strong>📝 Anotações recentes de ligações</strong>";messages.appendChild(title);}
 embeddedNotes.slice(0,8).forEach(function(note){
  const card=document.createElement("div");card.className="msg bot";
  card.appendChild(document.createTextNode((note.contact||"Contato")+": "+(note.text||"")));
  if(note.contract){
   card.appendChild(document.createElement("br"));card.appendChild(document.createTextNode("Contrato: "));
   const link=document.createElement("a");link.href="#";link.textContent=note.contract;
   link.onclick=function(event){event.preventDefault();sendContractOpen(note.contract);};card.appendChild(link);
  }
  messages.appendChild(card);
 });
 messages.scrollTop=messages.scrollHeight;
}
window.addEventListener("message",function(event){
 if(!event.data)return;
 if(event.data.type==="salesforce-data"||event.data.type==="salesforce-tasks"){
  embeddedTasks=Array.isArray(event.data.tasks)?event.data.tasks:[];
  embeddedNotes=Array.isArray(event.data.notes)?event.data.notes:embeddedNotes;
  status.textContent="Conectado ao Salesforce • "+embeddedTasks.length+" tarefas • "+embeddedNotes.length+" anotações";
  renderOverview();
 }
});
window.parent.postMessage({type:"yoda-ready"},"*");
function add(text,who){
 const el=document.createElement("div");el.className="msg "+who;
 const value=String(text||"");
 const pattern=/\\bcontrato\\s+([A-Z0-9-]+)/gi;
 let last=0, match;
 while((match=pattern.exec(value))){
  el.appendChild(document.createTextNode(value.slice(last,match.index)));
  const contractNumber=match[1];
  const link=document.createElement("a");
  link.href="#";
  link.textContent=contractNumber;
  link.style.color=who==="bot"?"#40377c":"#fff";
  link.style.fontWeight="700";
  link.style.textDecoration="underline";
  link.onclick=function(event){event.preventDefault();sendContractOpen(contractNumber);};
  el.appendChild(link);
  last=pattern.lastIndex;
 }
 el.appendChild(document.createTextNode(value.slice(last)));
 messages.appendChild(el);messages.scrollTop=messages.scrollHeight
}
document.getElementById("close").onclick=()=>{
 panel.hidden=true;toggle.hidden=false;
 if(embedded) window.parent.postMessage({type:"yoda-minimize"},"*");
};
toggle.onclick=()=>{
 panel.hidden=false;toggle.hidden=true;input.focus();
 if(embedded) window.parent.postMessage({type:"yoda-expand"},"*");
};
document.getElementById("form").onsubmit=async e=>{
 e.preventDefault(); const message=input.value.trim(); if(!message)return;
 add(message,"user"); input.value=""; status.textContent="Consultando o CRM...";
 try{
  const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message, tasks: embeddedTasks || undefined, notes: embeddedNotes || undefined})});
  const data=await r.json(); if(!r.ok) throw new Error(data.error||"Falha na consulta");
  add(data.reply||"Não encontrei uma resposta.","bot"); status.textContent="CRM consultado com sucesso";
 }catch(err){add("Não consegui consultar o CRM agora. Verifique se a API está disponível.","bot");status.textContent="Erro ao consultar o CRM"}
};
input.focus();
</script>
</body>
</html>
